log syslog { warning, error, fatal };

include "constants.conf";

router id SOURCE4;

roa4 table rpki4;
roa6 table rpki6;

# ── Import filter functions ────────────────────────────────────────────────────
# Each function rejects internally (with a log message) on violation and falls
# through otherwise. Compose them in a filter block in declaration order.

function reject_bogon_prefixes() {
    if ip_bogon() then
        reject_route("bogon prefix");
}

function reject_bogon_asns() {
    if bgp_path ~ ASN_BOGON then {
        print proto, " ", net, " rejected: bogon ASN in path ", bgp_path;
        reject;
    }
}

function reject_long_as_path() {
    if bgp_path.len > 50 then {
        print proto, " ", net, " rejected: AS path too long (", bgp_path.len, " hops)";
        reject;
    }
}

function reject_out_of_bounds_prefixes() {
    if bad_prefix_len() then {
        print proto, " ", net, " rejected: prefix length out of bounds /", net.len;
        reject;
    }
}

function reject_rpki_invalid() {
    int origin_as = bgp_path.last;
    case net.type {
        NET_IP4: if roa_check(rpki4, net, origin_as) = ROA_INVALID then {
            print proto, " ", net, " rejected: RPKI invalid (origin AS", origin_as, ")";
            reject;
        }
        NET_IP6: if roa_check(rpki6, net, origin_as) = ROA_INVALID then {
            print proto, " ", net, " rejected: RPKI invalid (origin AS", origin_as, ")";
            reject;
        }
    }
}

# ── Enforcement functions ──────────────────────────────────────────────────────

function enforce_first_as(int expected) {
    if bgp_path.first != expected then {
        print proto, " ", net, " rejected: first AS ", bgp_path.first, " != expected AS", expected;
        reject;
    }
}

function enforce_peer_nexthop(ip expected) {
    if bgp_next_hop != expected then {
        print proto, " ", net, " rejected: next-hop ", bgp_next_hop, " != expected ", expected;
        reject;
    }
}

# ── Attribute functions ────────────────────────────────────────────────────────

function honor_graceful_shutdown() {
    # RFC 8326: drain sessions before maintenance
    if (65535, 0) ~ bgp_community then bgp_local_pref = 0;
}

# ── Export functions ───────────────────────────────────────────────────────────

function accept_local() {
    case net.type {
        NET_IP4: if source = RTS_STATIC && proto = "static4" then accept;
        NET_IP6: if source = RTS_STATIC && proto = "static6" then accept;
    }
}

function remove_private_asns() {
    bgp_path.delete(ASN_PRIVATE);
}

# ── Protocols ─────────────────────────────────────────────────────────────────

protocol device {
    scan time 10;
}

protocol kernel {
    scan time 10;
    ipv4 {
        export filter {
            if source = RTS_STATIC && proto != "static4" then accept;
            if source = RTS_BGP then {
                krt_prefsrc = SOURCE4;
                accept;
            }
            reject;
        };
    };
}

protocol kernel {
    scan time 10;
    ipv6 {
        export filter {
            if source = RTS_STATIC && proto != "static6" then accept;
            if source = RTS_BGP then {
                krt_prefsrc = SOURCE6;
                accept;
            }
            reject;
        };
    };
}

# ── BGP templates ─────────────────────────────────────────────────────────────

template bgp base {
    local as ASN port 179;
    graceful restart on;
    default bgp_local_pref 50;
}

template bgp base4 from base {
    ipv4 {
        import keep filtered;
        export filter {
            remove_private_asns();
            accept_local();
            reject;
        };
    };
}

template bgp base6 from base {
    ipv6 {
        import keep filtered;
        export filter {
            remove_private_asns();
            accept_local();
            reject;
        };
    };
}
